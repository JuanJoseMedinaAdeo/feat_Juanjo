name: npm test
on: 
  workflow_dispatch:
               
jobs:
  job1:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v5.0.1
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.0.0
      - run: npm install
      - run: npm test
  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.1
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.0.0
     
